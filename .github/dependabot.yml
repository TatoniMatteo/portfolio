version: 2
# Aggiornamenti ordinari mensili: massimo 4 PR aperte in totale.
# Le correzioni di sicurezza hanno gruppi e limiti separati.
updates:
  # Dipendenze npm (React, Vite, Oxlint, pdfjs-dist, ...)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # I tipi devono seguire il runtime Node 24 LTS del progetto.
    # Le migrazioni a una nuova major di Node vengono coordinate manualmente.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Minor e patch confluiscono in un'unica PR mensile.
      # I major restano separati per verificarli uno alla volta.
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  # Le due immagini base nel Dockerfile (node, caddy)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    # Restiamo su Node 24 LTS: le nuove major richiedono una migrazione coordinata.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]

  # Le action usate nelle workflow (actions/checkout, docker/build-push-action, ...)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
