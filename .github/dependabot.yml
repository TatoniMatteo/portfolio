version: 2
updates:
  # Dipendenze npm (React, Vite, eslint, pdfjs-dist, ...)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Gli aggiornamenti minor/patch non da soli, insieme in una sola PR
      # settimanale; i major (quelli che possono rompere qualcosa, come è
      # successo con eslint 9->10 e pdfjs-dist 5->6) restano separati così
      # si rivedono uno a uno.
      minor-and-patch:
        update-types: [minor, patch]

  # Le due immagini base nel Dockerfile (node, caddy)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Le action usate nelle workflow (actions/checkout, docker/build-push-action, ...)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
