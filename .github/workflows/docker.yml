name: Docker images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Build e scansione - ${{ matrix.target }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            image: portfolio
            arch: amd64
            runner: ubuntu-24.04
          - target: web
            image: portfolio
            arch: arm64
            runner: ubuntu-24.04-arm
          - target: cv-updater
            image: portfolio-cv-updater
            arch: amd64
            runner: ubuntu-24.04
          - target: cv-updater
            image: portfolio-cv-updater
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Nome immagine
        id: name
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Metadati immagine
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: type=sha,prefix=sha-

      # Ogni architettura viene compilata sul proprio runner nativo, senza QEMU.
      # La stessa immagine viene analizzata e conservata come artifact, senza rebuild.
      - name: Build immagine
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: |
            type=gha,scope=native-${{ matrix.target }}-${{ matrix.arch }}
            type=gha,scope=scan-${{ matrix.target }}
            type=gha,scope=publish-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=native-${{ matrix.target }}-${{ matrix.arch }}

      - name: Scansione vulnerabilità (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}-${{ matrix.arch }}
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # Nessuna immagine viene inviata a GHCR durante i controlli.
      - name: Esportazione variante verificata
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          ARCH: ${{ matrix.arch }}
        run: docker save --output "$RUNNER_TEMP/image-$ARCH.tar" "$IMAGE:sha-$GITHUB_SHA-$ARCH"

      - name: Conservazione variante verificata
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

  release:
    name: Data di rilascio
    runs-on: ubuntu-24.04
    needs: scan
    if: github.ref == 'refs/heads/main' && needs.scan.result == 'success'
    outputs:
      tag: ${{ steps.date.outputs.tag }}
    steps:
      - name: Generazione tag UTC comune alle immagini
        id: date
        run: echo "tag=$(date -u +'%Y%m%d')" >> "$GITHUB_OUTPUT"

  publish:
    name: Pubblicazione - ${{ matrix.target }}
    runs-on: ubuntu-24.04
    needs: [scan, release]

    if: github.ref == 'refs/heads/main' && needs.scan.result == 'success'

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            image: portfolio
          - target: cv-updater
            image: portfolio-cv-updater

    steps:
      - name: Nome immagine
        id: name
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Metadati immagine
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.release.outputs.tag }}
            type=sha,prefix=sha-

      - name: Login a GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Questo job parte solo dopo il successo di TUTTE le build e scansioni.
      - name: Recupero varianti verificate
        uses: actions/download-artifact@v5
        with:
          pattern: image-${{ matrix.target }}-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Caricamento varianti verificate su GHCR
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        shell: bash
        run: |
          for arch in amd64 arm64; do
            docker load --input "$RUNNER_TEMP/images/image-$arch.tar"
          done
          for arch in amd64 arm64; do
            docker push "$IMAGE:sha-$GITHUB_SHA-$arch"
          done

      # Assembla solo il manifest delle immagini già compilate e analizzate.
      - name: Pubblicazione manifest multiarch
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          tag_args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              tag_args+=(--tag "$tag")
            fi
          done <<< "$TAGS"
          docker buildx imagetools create "${tag_args[@]}" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" \
            "$IMAGE:sha-$GITHUB_SHA-arm64"
