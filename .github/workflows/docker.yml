name: Docker images

# Ad ogni push/merge su master costruisce le due immagini (web e cv-updater),
# le scansiona con Trivy e, solo se non ci sono vulnerabilità HIGH/CRITICAL
# con fix disponibile, le pubblica su GHCR
# (ghcr.io/<owner>/portfolio e ghcr.io/<owner>/portfolio-cv-updater).
# Sulle pull request fa solo build + scan, senza pubblicare nulla.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            image: portfolio
          - target: cv-updater
            image: portfolio-cv-updater
    steps:
      - uses: actions/checkout@v7

      # I nomi delle immagini devono essere minuscoli (l'owner qui è TatoniMatteo)
      - name: Nome immagine
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-
          # org.opencontainers.image.source punta a questo repo: è ciò che fa
          # comparire il package nella sezione "Packages" del repository.

      # Build locale (solo amd64, "load" non supporta multi-piattaforma) per
      # poter scansionare l'immagine PRIMA di pubblicarla. Le cache sotto
      # sono condivise con la build multi-piattaforma finale, quindi questo
      # secondo passaggio costa relativamente poco in più.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: scan/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Scansione vulnerabilità (Trivy)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: scan/${{ matrix.image }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          # Come per il vecchio problema gh-pages/braces: una vulnerabilità
          # "alta" ma senza fix disponibile non ha senso che blocchi il
          # deploy, non c'è nulla da aggiornare per risolverla.
          ignore-unfixed: true
          exit-code: '1'

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        if: github.event_name != 'pull_request'
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
