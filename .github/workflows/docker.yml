name: Docker images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Build e scansione - ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            image: portfolio
          - target: cv-updater
            image: portfolio-cv-updater

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build locale: l'immagine viene caricata nel Docker daemon
      # del runner per poter essere analizzata da Trivy.
      - name: Build immagine
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: scan/${{ matrix.image }}:${{ github.sha }}
          cache-from: |
            type=gha,scope=scan-${{ matrix.target }}
            type=gha,scope=publish-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=scan-${{ matrix.target }}

      - name: Scansione vulnerabilità (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan/${{ matrix.image }}:${{ github.sha }}
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  publish:
    name: Pubblicazione - ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: scan

    if: github.ref == 'refs/heads/main' && needs.scan.result == 'success'

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            image: portfolio
          - target: cv-updater
            image: portfolio-cv-updater

    steps:
      - uses: actions/checkout@v7

      - name: Nome immagine
        id: name
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Metadati immagine
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,prefix=sha-

      - name: Login a GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e pubblicazione multiarch
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: |
            type=gha,scope=scan-${{ matrix.target }}
            type=gha,scope=publish-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.target }}
