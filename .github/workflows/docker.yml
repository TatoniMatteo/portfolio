name: Docker image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Build e scansione - ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Nome immagine
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/portfolio" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Metadati immagine
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: type=sha,prefix=sha-

      # Ogni architettura viene compilata sul proprio runner nativo, senza QEMU.
      # La stessa immagine viene analizzata e conservata come artifact, senza rebuild.
      - name: Build immagine
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=portfolio-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=portfolio-${{ matrix.arch }}

      - name: Verifica updater e supervisore nell'immagine
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE/docker:/workspace/docker:ro" \
            --volume "$GITHUB_WORKSPACE/scripts/cv:/workspace/scripts/cv:ro" \
            --volume "$GITHUB_WORKSPACE/tests/runtime:/workspace/tests/runtime:ro" \
            --volume "$GITHUB_WORKSPACE/tests/updater:/workspace/tests/updater:ro" \
            --workdir /workspace --entrypoint node "$IMAGE:sha-$GITHUB_SHA-$ARCH" \
            --test tests/runtime/*.test.mjs tests/updater/*.test.mjs

      - name: Scansione vulnerabilità (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}-${{ matrix.arch }}
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # Nessuna immagine viene inviata a GHCR durante i controlli.
      - name: Esportazione variante verificata
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          ARCH: ${{ matrix.arch }}
        run: docker save --output "$RUNNER_TEMP/image-$ARCH.tar" "$IMAGE:sha-$GITHUB_SHA-$ARCH"

      - name: Conservazione variante verificata
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

  publish:
    name: Pubblicazione portfolio
    runs-on: ubuntu-24.04
    needs: scan
    if: github.ref == 'refs/heads/main' && needs.scan.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Nome immagine
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/portfolio" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Login a GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Questo job parte solo dopo il successo di TUTTE le build e scansioni.
      - name: Recupero varianti verificate
        uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Installazione strumento di copia per digest
        run: sudo apt-get update && sudo apt-get install --yes skopeo

      # Copia le immagini verificate senza rebuild né tag intermedi sul registry.
      - name: Pubblicazione manifest multiarch
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        shell: bash
        run: |
          refs=()
          for arch in amd64 arm64; do
            image_dir="$RUNNER_TEMP/verified-$arch"
            skopeo copy --format v2s2 --dest-compress \
              "docker-archive:$RUNNER_TEMP/images/image-$arch.tar" "dir:$image_dir"
            digest="$(skopeo manifest-digest "$image_dir/manifest.json")"
            skopeo copy --preserve-digests --authfile "$HOME/.docker/config.json" \
              "dir:$image_dir" "docker://$IMAGE@$digest"
            refs+=("$IMAGE@$digest")
          done
          release_tag="$(date -u +'%Y%m%d')"
          docker buildx imagetools create \
            --tag "$IMAGE:latest" --tag "$IMAGE:$release_tag" "${refs[@]}"
          echo "Pubblicata $IMAGE con i tag latest e $release_tag" >> "$GITHUB_STEP_SUMMARY"
