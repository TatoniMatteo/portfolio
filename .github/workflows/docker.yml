name: Docker images

# Su ogni push/merge su master costruisce le immagini (web e cv-updater),
# le scansiona con Trivy e, se non ci sono vulnerabilità HIGH/CRITICAL
# con fix disponibile, le pubblica su GHCR.
# Ogni pubblicazione usa i tag latest, data del rilascio e SHA del commit.
# L'avvio manuale è consentito, ma la pubblicazione avviene solo da master.
on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            image: portfolio
          - target: cv-updater
            image: portfolio-cv-updater
    steps:
      - uses: actions/checkout@v7
      - name: Nome immagine
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value={{date 'YYYYMMDD'}},enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-

      # Build locale per scansionare l'immagine prima della pubblicazione.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: scan/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Scansione vulnerabilità (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan/${{ matrix.image }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/master'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        if: github.ref == 'refs/heads/master'
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
