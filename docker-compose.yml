# Deploy sul server:   docker compose pull && docker compose up -d --no-build
# Prova in locale:     docker compose up --build        (poi http://localhost:8080)
#
# Con GitHub App serve anche docker-compose.github-app.yml (vedi .env.example).
# Le immagini vengono
# pubblicate su GHCR dalla GitHub Action ad ogni push su main.

services:
  web:
    image: ghcr.io/tatonimatteo/portfolio:${IMAGE_TAG:-latest}
    build:
      context: .
      target: runtime
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - cv-data:/cv-data
    security_opt:
      - no-new-privileges:true
    environment:
      # PAT oppure GitHub App (vedi docker-compose.github-app.yml).
      # Senza credenziali il sito parte lo stesso, ma senza CV.
      CV_REPO_TOKEN: ${CV_REPO_TOKEN:-}
      CV_APP_ID: ${CV_APP_ID:-}
      CV_CHECK_INTERVAL_HOURS: ${CV_CHECK_INTERVAL_HOURS:-24}
      CV_IT_FILENAME: ${CV_IT_FILENAME:-CV-Matteo-Tatoni-IT.pdf}
      CV_EN_FILENAME: ${CV_EN_FILENAME:-CV-Matteo-Tatoni-EN.pdf}

volumes:
  cv-data:
